<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ|BOM — Structural Logic</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='28' cy='28' r='16' fill='white'/%3E%3Ccircle cx='72' cy='28' r='16' fill='white'/%3E%3Ccircle cx='72' cy='72' r='16' fill='white'/%3E%3Crect x='12' y='56' width='32' height='32' rx='3' fill='%23f97316'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-main: #121212;
    --bg-card: #1e1e1e;
    --bg-input: #2a2a2a;
    --accent-primary: #f97316; /* Standing Square Orange */
    --accent-secondary: #00d4ff; /* Technical Cyan */
    --text-primary: #f5f5f5;
    --text-secondary: #b0b0b0;
    --border: #333;
    --error: #ff5252;
    --ok: #4caf50;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; 
    font-family: 'Inter', -apple-system, system-ui, sans-serif; 
    background: var(--bg-main); 
    color: var(--text-primary); 
    padding: 20px;
  }

  header { 
    max-width: 1000px; 
    margin: 0 auto 30px; 
    display: flex; 
    align-items: center; 
    gap: 15px; 
  }

  .logo-svg { width: 45px; height: 45px; }
  .logo-text { font-size: 1.8rem; letter-spacing: -0.5px; }
  .logo-text b { font-weight: 800; color: #fff; }
  .logo-text span { font-weight: 200; color: var(--text-secondary); }

  .container { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }
  
  .card { 
    background: var(--bg-card); 
    border: 1px solid var(--border); 
    border-radius: 12px; 
    padding: 24px; 
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-secondary); margin: 0 0 20px 0; border-left: 3px solid var(--accent-primary); padding-left: 10px; }

  .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
  
  select, input { 
    background: var(--bg-input); 
    border: 1px solid var(--border); 
    color: #fff; 
    padding: 12px; 
    border-radius: 8px; 
    font-size: 0.9rem; 
    outline: none; 
    transition: border 0.2s;
  }
  select:focus, input:focus { border-color: var(--accent-secondary); }

  .preview-bar { background: rgba(0,212,255,0.05); border: 1px dashed var(--accent-secondary); padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-top: 10px; display: flex; gap: 15px; flex-wrap: wrap; }

  button { 
    background: var(--accent-primary); 
    color: #fff; 
    border: none; 
    padding: 14px 24px; 
    border-radius: 8px; 
    font-weight: 700; 
    cursor: pointer; 
    transition: transform 0.1s, opacity 0.2s; 
    width: 100%;
  }
  button:active { transform: scale(0.98); }
  button:hover { opacity: 0.9; }

  .bom-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
  .bom-table th { text-align: left; padding: 12px; color: var(--text-secondary); border-bottom: 2px solid var(--border); font-size: 0.7rem; text-transform: uppercase; }
  .bom-table td { padding: 12px; border-bottom: 1px solid var(--border); }
  .qty-pill { background: var(--accent-primary); color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }

  .footer-meta { text-align: center; padding: 60px 0 20px; font-size: 0.6rem; color: #222; user-select: none; }
</style>
</head>
<body>

<header>
    <svg class="logo-svg" viewBox="0 0 100 100">
        <circle cx="28" cy="28" r="16" fill="white"/><circle cx="72" cy="28" r="16" fill="white"/><circle cx="72" cy="72" r="16" fill="white"/>
        <rect x="12" y="56" width="32" height="32" rx="3" fill="#f97316"/>
    </svg>
    <div class="logo-text"><b>EZ</b><span> | BOM</span></div>
</header>

<div class="container">
    <div class="card">
        <h2>Rooftop Config (Aeri Rail)</h2>
        <div class="input-grid">
            <div class="field">
                <label>Orientation</label>
                <select id="rt-orient" onchange="rtPreview()">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>
            <div class="field">
                <label>Panel Qty</label>
                <input type="number" id="rt-qty" value="6" min="1" oninput="rtPreview()">
            </div>
            <div class="field">
                <label>Strings</label>
                <input type="number" id="rt-strings" value="1" min="1">
            </div>
        </div>
        <div id="rt-preview" class="preview-bar"></div>
        <button style="margin-top:20px;" onclick="addRooftop()">Add to Project</button>
    </div>

    <div class="card">
        <h2>Short Rail Config</h2>
        <div class="input-grid">
            <div class="field">
                <label>Mounting System</label>
                <select id="sr-type">
                    <option value="H25">H25 Portrait (400mm)</option>
                    <option value="H60">H60 Portrait (400mm)</option>
                    <option value="H30">H30 Landscape (120mm)</option>
                </select>
            </div>
            <div class="field">
                <label>Panel Qty</label>
                <input type="number" id="sr-qty" value="6" min="1">
            </div>
            <div class="field">
                <label>Strings</label>
                <input type="number" id="sr-strings" value="1" min="1">
            </div>
        </div>
        <button onclick="addShortRail()">Add to Project</button>
    </div>

    <div class="card" id="bom-card" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Master Project BOM</h2>
            <button style="width:auto; padding: 6px 12px; background:#444; font-size:0.7rem;" onclick="clearCart()">Reset</button>
        </div>
        <table class="bom-table">
            <thead>
                <tr><th>Code</th><th>Description</th><th style="text-align:right">Qty</th></tr>
            </thead>
            <tbody id="bom-body"></tbody>
        </table>
    </div>
</div>

<footer class="footer-meta">
    EZ | BOM Systems © 2026 Norman Myburgh. All Rights Reserved.
</footer>

<script>
let cart = {};

const SEQ = [
  {c:'ER-R-AE/3600', d:'Aeri Rail, 40*3600mm'},
  {c:'ER-R-AE/2400', d:'Aeri Rail, 40*2400mm'},
  {c:'ER-ECAE/28-36/L50', d:'Universal end clamp 28-40mm Aeri'},
  {c:'ER-IC-AE/30-40/L50', d:'Inter Clamp 30-40mm'},
  {c:'WQ-TRE-3035-S', d:'Silver TR End Clamp'},
  {c:'WQ-TRM-3035-S', d:'Silver TR Mid Clamp'},
  {c:'WQ-TRπ-25-400', d:'H25 TR π MiniRail, 400mm'},
  {c:'WQ-TRπ-60-400', d:'H60 TR π MiniRail, 400mm'},
  {c:'WQ-TRU-30-120', d:'H30 TR U MiniRail, 120mm'},
  {c:'EZ-GC-AE', d:'Grounding Clip for Aeri Rail'},
  {c:'EZ-GL-U', d:'Universal Grounding Lug'},
  {c:'WQ-TR-GL', d:'TR Grounding Lug'},
  {c:'EZ-CC-PV/4', d:'Universal Cable Clip for PV Panels'}
];

function rtPreview(){
  const qty = parseInt(document.getElementById('rt-qty').value);
  const isP = document.getElementById('rt-orient').value === 'portrait';
  if(!qty) return;
  const run = ((isP?1134:2278)*qty) + (20*(qty-1)) + 80;
  const r36 = Math.floor(run/3600);
  const r24 = (run%3600 > 0) ? 1 : 0;
  document.getElementById('rt-preview').innerHTML = `<strong>Run:</strong> ${run}mm | <strong>Needed:</strong> ${r36}x 3.6m + ${r24}x 2.4m`;
}

function addRooftop(){
  const q = parseInt(document.getElementById('rt-qty').value), s = parseInt(document.getElementById('rt-strings').value);
  const isP = document.getElementById('rt-orient').value === 'portrait';
  const run = ((isP?1134:2278)*q) + (20*(q-1)) + 80;
  
  update('ER-R-AE/3600', Math.floor(run/3600)*2*s);
  update('ER-R-AE/2400', (run%3600 > 0 ? 1 : 0)*2*s);
  update('ER-ECAE/28-36/L50', 4*s);
  update('ER-IC-AE/30-40/L50', (q-1)*2*s);
  update('EZ-GC-AE', (q-1)*2*s);
  update('EZ-GL-U', 2*s);
  update('EZ-CC-PV/4', q*s);
  render();
}

function addShortRail(){
  const t = document.getElementById('sr-type').value, q = parseInt(document.getElementById('sr-qty').value), s = parseInt(document.getElementById('sr-strings').value);
  const rails = ((q-1)*2+4)*s;
  if(t==='H25') update('WQ-TRπ-25-400', rails);
  else if(t==='H60') update('WQ-TRπ-60-400', rails);
  else update('WQ-TRU-30-120', rails);
  
  update('WQ-TRE-3035-S', 4*s);
  update('WQ-TRM-3035-S', (q-1)*2*s);
  update('WQ-TR-GL', 2*s);
  update('EZ-CC-PV/4', q*s);
  render();
}

function update(c, q){ cart[c] = (cart[c] || 0) + q; }

function render(){
  const b = document.getElementById('bom-body'); b.innerHTML = '';
  let items = false;
  SEQ.forEach(item => {
    if(cart[item.c] > 0){
      items = true;
      b.innerHTML += `<tr><td>${item.c}</td><td>${item.d}</td><td style="text-align:right"><span class="qty-pill">${cart[item.c]}</span></td></tr>`;
    }
  });
  document.getElementById('bom-card').style.display = items ? 'block' : 'none';
}

function clearCart(){ cart = {}; render(); }
rtPreview();
</script>
</body>
</html>
